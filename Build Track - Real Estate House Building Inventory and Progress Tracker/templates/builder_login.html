<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Builder Login - Site Portal - BuildTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #1c1917 0%, #292524 50%, #44403c 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.25rem;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
      background-color: #ffffff;
    }
    .auth-header {
      background: linear-gradient(135deg, #292524 0%, #1c1917 100%);
      padding: 2rem 1.5rem;
      text-align: center;
      color: #ffffff;
      border-bottom: 3px solid var(--accent-color);
    }
    .auth-icon {
      font-size: 2.75rem;
      color: var(--accent-color);
      line-height: 1;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>

<div class="auth-card">
  <div class="auth-header">
    <div class="auth-icon"><i class="bi bi-cone-striped"></i></div>
    <h3 class="fw-bold mb-1">Site Portal</h3>
    <p class="text-light opacity-75 small mb-0">BuildTrack Construction & Inventory</p>
    <div class="mt-2"><span class="badge bg-warning text-dark px-3 py-1">BUILDER / SITE ENGINEER</span></div>
  </div>

  <div class="p-4">
    <!-- Flash Messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show small" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('builder_login') }}" method="POST">
      <div class="mb-3">
        <label for="email" class="form-label small fw-semibold text-muted">Site Engineer Email</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-person-badge"></i></span>
          <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required placeholder="engineer@buildtrack.com">
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label small fw-semibold text-muted">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted"><i class="bi bi-key"></i></span>
          <input type="password" class="form-control" id="password" name="password" required placeholder="Enter password">
        </div>
      </div>

      <button type="submit" class="btn btn-warning w-100 py-2 fw-semibold text-dark mt-2 shadow-sm">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Site Portal
      </button>
    </form>

    <!-- Portal Switcher -->
    <div class="text-center mt-3 pt-2 border-top">
      <span class="text-muted small">Are you an Administrator?</span>
      <a href="{{ url_for('login') }}" class="btn btn-outline-primary btn-sm w-100 mt-2">
        <i class="bi bi-shield-lock me-1"></i>Switch to Admin Portal
      </a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
