{% extends "base.html" %}

{% block title %}Page Not Found (404) – FarmDirect{% endblock %}

{% block content %}
<div class="container my-5 text-center">
    <div class="card card-custom p-5 mx-auto shadow-sm" style="max-width: 600px;">
        <i class="bi bi-compass text-warning display-1 mb-3"></i>
        <h2 class="fw-bold">404 – Page Not Found</h2>
        <p class="text-muted lead">The requested agricultural page or product could not be located.</p>
        <div class="d-flex justify-content-center gap-2 mt-4">
            <a href="{{ url_for('index') }}" class="btn btn-farm">
                <i class="bi bi-house-door me-1"></i>Back to Home
            </a>
            <a href="{{ url_for('products') }}" class="btn btn-outline-success">
                <i class="bi bi-basket me-1"></i>Browse Marketplace
            </a>
        </div>
    </div>
</div>
{% endblock %}
