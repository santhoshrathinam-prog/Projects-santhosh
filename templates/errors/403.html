{% extends "base.html" %}

{% block title %}Access Denied (403) – FarmDirect{% endblock %}

{% block content %}
<div class="container my-5 text-center">
    <div class="card card-custom p-5 mx-auto shadow-sm" style="max-width: 600px;">
        <i class="bi bi-shield-lock text-danger display-1 mb-3"></i>
        <h2 class="fw-bold text-danger">403 – Access Forbidden</h2>
        <p class="text-muted lead">You do not have permission to view or manage this portal page.</p>
        <div class="d-flex justify-content-center gap-2 mt-4">
            <a href="{{ url_for('index') }}" class="btn btn-farm">
                <i class="bi bi-house-door me-1"></i>Return Home
            </a>
            <a href="{{ url_for('login') }}" class="btn btn-outline-secondary">
                <i class="bi bi-box-arrow-in-right me-1"></i>Switch Account
            </a>
        </div>
    </div>
</div>
{% endblock %}
