{% extends "base.html" %}

{% block title %}Review Product – FarmDirect{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="d-flex align-items-center mb-3">
                <a href="{{ url_for('customer_order_details', order_id=order_id) }}" class="btn btn-outline-secondary btn-sm me-2">
                    <i class="bi bi-arrow-left"></i>
                </a>
                <h3 class="fw-bold text-dark mb-0">Review Farm Produce</h3>
            </div>

            <div class="card card-custom p-4">
                <div class="p-3 bg-light rounded-3 mb-4">
                    <div class="d-flex align-items-center gap-3">
                        <div class="fs-2 text-success"><i class="bi bi-flower1"></i></div>
                        <div>
                            <h5 class="fw-bold mb-0">{{ product.product_name }}</h5>
                            <small class="text-muted">Purchased on Order #{{ order_id }} from {{ product.farm_name }}</small>
                        </div>
                    </div>
                </div>

                <form method="POST" action="{{ url_for('submit_review', order_id=order_id, product_id=product.product_id) }}">
                    <div class="mb-4">
                        <label class="form-label fw-bold">Star Rating <span class="text-danger">*</span></label>
                        <div class="d-flex gap-3">
                            {% for r in range(5, 0, -1) %}
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="rating" id="rating{{ r }}" value="{{ r }}" {% if r == 5 %}checked{% endif %} required>
                                    <label class="form-check-label fw-semibold" for="rating{{ r }}">
                                        {{ r }} <i class="bi bi-star-fill text-warning"></i>
                                    </label>
                                </div>
                            {% endfor %}
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="review_text" class="form-label fw-semibold">Your Feedback / Review Comments</label>
                        <textarea class="form-control" id="review_text" name="review_text" rows="4" maxlength="500" placeholder="Describe the freshness, taste, packaging, and overall satisfaction with this crop..." required></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('customer_order_details', order_id=order_id) }}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-farm px-4">
                            <i class="bi bi-send me-1"></i>Submit Verified Review
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
